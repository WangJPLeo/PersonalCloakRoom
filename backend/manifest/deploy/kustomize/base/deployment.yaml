apiVersion: apps/v1
kind: Deployment
metadata:
  name: personalcloakroom-backend
  labels:
    app: personalcloakroom-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: personalcloakroom-backend
  template:
    metadata:
      labels:
        app: personalcloakroom-backend
    spec:
      containers:
        - name : main
          image: personalcloakroom-backend
          imagePullPolicy: Always

