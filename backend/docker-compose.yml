services:
  personalcloakroom:
    build:
      context: .
      dockerfile: manifest/docker/Dockerfile
    container_name: personalcloakroom-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: ./.env
        required: false
    environment:
      # 模型变量从 .env 注入，避免空插值覆盖 env_file 中的凭据。
      - GF_SERVER_ADDRESS=:8000
