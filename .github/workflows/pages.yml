name: Deploy mobile website

on:
  push:
    branches: [main, codex/mobile-web]
    paths:
      - index.html
      - data.js
      - assets/**
      - scripts/build-pages.mjs
      - tests/pages_build_test.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/frontend_tryon_test.mjs
      - run: node --test tests/pages_build_test.mjs
      - run: node scripts/build-pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
